version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_gym_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_gym_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_gym_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai_gym_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "AI Gym & Fitness Assistant"
      ENVIRONMENT: "development"
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-use-a-strong-secret-key-32-bytes}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-ai_gym_db}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  realtime:
    build:
      context: .
      dockerfile: ./apps/realtime-service/Dockerfile
    container_name: ai_gym_realtime
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9121:9121"
    environment:
      NODE_ENV: "production"
      PORT: "8080"
      METRICS_PORT: "9121"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
