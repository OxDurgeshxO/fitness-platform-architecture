services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fitness_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: fitness-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_token_2026}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  realtime-service:
    build:
      context: .
      dockerfile: apps/realtime-service/Dockerfile
    container_name: fitness-realtime-service-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-fitness_admin}:${POSTGRES_PASSWORD:-fitness_secure_password_2026}@postgres:5432/${POSTGRES_DB:-fitness_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_token_2026}@redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
