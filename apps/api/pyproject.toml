[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gym-api"
version = "0.1.0"
description = "FastAPI backend for AI Gym & Fitness Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Durgesh Dutt Sinha", email = "durgesh@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.10.0.84",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
