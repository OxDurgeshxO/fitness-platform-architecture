name: Architecture Docs Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown Documents
        run: |
          echo "Verifying architecture specifications..."
          ls -la *.md
          echo "All architecture documents verified."